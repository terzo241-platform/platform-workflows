name: Node.js CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to use
        type: string
        default: "20"
      working-directory:
        description: Directory containing the Node.js project
        type: string
        default: "."
      package-manager:
        description: Package manager (npm, pnpm, or yarn)
        type: string
        default: "npm"
      enable-playwright:
        description: Run Playwright E2E tests
        type: boolean
        default: false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            corepack enable pnpm
            pnpm install --frozen-lockfile
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Lint
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run lint --if-present
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn lint --if-present
          else
            npm run lint --if-present
          fi

  test:
    name: Unit Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            corepack enable pnpm
            pnpm install --frozen-lockfile
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Test
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm test --if-present
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn test --if-present
          else
            npm test --if-present
          fi

  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            corepack enable pnpm
            pnpm install --frozen-lockfile
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn install --frozen-lockfile
          else
            npm ci
          fi

      - name: Build
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm run build
          elif [ "${{ inputs.package-manager }}" = "yarn" ]; then
            yarn build
          else
            npm run build
          fi

  playwright:
    name: E2E Tests
    if: inputs.enable-playwright
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1/3, 2/3, 3/3]
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            corepack enable pnpm
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright
        run: npx playwright test --shard=${{ matrix.shard }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: ${{ inputs.working-directory }}/playwright-report/

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Platform security scan (Trivy + gitleaks)
        uses: terzo241-platform/platform-workflows/.github/actions/security-scan@main
        with:
          scan-type: "fs"
          severity: "HIGH,CRITICAL"
          enable-gitleaks: "true"
          fail-on-findings: "true"
