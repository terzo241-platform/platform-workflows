name: Container Build & Push

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name (without registry prefix)
        type: string
        required: true
      dockerfile:
        description: Path to Dockerfile
        type: string
        default: "./Dockerfile"
      context:
        description: Docker build context
        type: string
        default: "."
      registry:
        description: Artifact Registry hostname
        type: string
        default: "asia-south1-docker.pkg.dev"
      gcp-project-id:
        description: GCP project ID for Artifact Registry
        type: string
        required: true
      ar-repository:
        description: Artifact Registry repository name
        type: string
        default: "platform-images"
      wif-provider:
        description: Workload Identity Federation provider (projects/NUM/locations/global/workloadIdentityPools/POOL/providers/PROVIDER)
        type: string
        required: true
      wif-service-account:
        description: Service account email for WIF
        type: string
        required: true
      push:
        description: Push image to registry (false for PR builds)
        type: boolean
        default: false
      tag-strategy:
        description: "Tagging strategy: sha, semver, or branch"
        type: string
        default: "sha"
      scan-severity:
        description: Trivy scan severity threshold for container image
        type: string
        default: "HIGH,CRITICAL"
      fail-on-vulnerabilities:
        description: Fail the build if container vulnerabilities found
        type: boolean
        default: true
      sign-image:
        description: Sign image with cosign (keyless via Sigstore/Fulcio)
        type: boolean
        default: true
    outputs:
      image-ref:
        description: Full image reference (registry/project/repo/image:tag)
        value: ${{ jobs.build.outputs.image-ref }}
      image-digest:
        description: Image digest (sha256:...)
        value: ${{ jobs.build.outputs.image-digest }}

jobs:
  build:
    name: Build Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    outputs:
      image-ref: ${{ steps.meta.outputs.image-ref }}
      image-digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to GCP via OIDC
        if: inputs.push
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ inputs.wif-provider }}
          service_account: ${{ inputs.wif-service-account }}

      - name: Configure Docker for Artifact Registry
        if: inputs.push
        run: gcloud auth configure-docker ${{ inputs.registry }} --quiet

      - name: Generate image metadata
        id: meta
        run: |
          REGISTRY="${{ inputs.registry }}"
          PROJECT="${{ inputs.gcp-project-id }}"
          REPO="${{ inputs.ar-repository }}"
          IMAGE="${{ inputs.image-name }}"
          BASE="${REGISTRY}/${PROJECT}/${REPO}/${IMAGE}"

          SHA="${{ github.sha }}"
          SHORT_SHA="${SHA:0:7}"
          BRANCH="${{ github.ref_name }}"
          SAFE_BRANCH=$(echo "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')

          if [[ "${{ inputs.tag-strategy }}" == "semver" && "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          elif [[ "${{ inputs.tag-strategy }}" == "branch" ]]; then
            TAG="${SAFE_BRANCH}-${SHORT_SHA}"
          else
            TAG="${SHORT_SHA}"
          fi

          echo "image-ref=${BASE}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${BASE}:${TAG},${BASE}:latest" >> "$GITHUB_OUTPUT"
          echo "### Container Image" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Image**: \`${BASE}:${TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Push**: ${{ inputs.push }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and load locally for scanning
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ inputs.image-name }}:scan
          cache-from: type=gha

      - name: Scan container image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ inputs.image-name }}:scan"
          format: "table"
          severity: ${{ inputs.scan-severity }}
          exit-code: ${{ inputs.fail-on-vulnerabilities && '1' || '0' }}

      - name: Scan container image (SARIF for GitHub Security)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "${{ inputs.image-name }}:scan"
          format: "sarif"
          output: "container-trivy.sarif"
          severity: ${{ inputs.scan-severity }}
          exit-code: "0"

      - name: Upload container scan SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: "container-trivy.sarif"
          category: "container-trivy"

      - name: Build and push to registry
        if: inputs.push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Build (no push)
        if: ${{ !inputs.push }}
        id: build-only
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        if: inputs.push && inputs.sign-image
        uses: sigstore/cosign-installer@v3

      - name: Sign container image (keyless via Sigstore/Fulcio)
        if: inputs.push && inputs.sign-image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes \
            --oidc-issuer=https://token.actions.githubusercontent.com \
            "${{ steps.meta.outputs.image-ref }}@${{ steps.push.outputs.digest }}"
          echo "Image signed with keyless cosign (Sigstore/Fulcio)"

      - name: Verify signature
        if: inputs.push && inputs.sign-image
        run: |
          cosign verify \
            --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="https://github.com/${{ github.repository_owner }}/.*" \
            "${{ steps.meta.outputs.image-ref }}@${{ steps.push.outputs.digest }}" | head -20

      - name: Container build summary
        if: always()
        run: |
          echo "### Container Security" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Scan severity**: ${{ inputs.scan-severity }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SLSA Provenance**: ${{ inputs.push && 'Attached' || 'N/A (not pushed)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **SBOM**: ${{ inputs.push && 'Attached' || 'N/A (not pushed)' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Cosign Signature**: ${{ (inputs.push && inputs.sign-image) && 'Signed (keyless)' || 'N/A' }}" >> "$GITHUB_STEP_SUMMARY"
