name: Java CI

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version to use
        type: string
        default: "17"
      java-distribution:
        description: Java distribution (temurin, corretto, zulu)
        type: string
        default: "temurin"
      working-directory:
        description: Directory containing the Java project
        type: string
        default: "."
      build-tool:
        description: Build tool (maven or gradle)
        type: string
        default: "maven"
      enable-security-scan:
        description: Run OWASP dependency check
        type: boolean
        default: false

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: ${{ inputs.build-tool }}

      - name: Build & Test (Maven)
        if: inputs.build-tool == 'maven'
        run: mvn -B verify --no-transfer-progress

      - name: Build & Test (Gradle)
        if: inputs.build-tool == 'gradle'
        run: ./gradlew build --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            ${{ inputs.working-directory }}/target/surefire-reports/*.xml
            ${{ inputs.working-directory }}/build/test-results/**/*.xml

  lint:
    name: Lint (Checkstyle/SpotBugs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: ${{ inputs.build-tool }}

      - name: Checkstyle (Maven)
        if: inputs.build-tool == 'maven'
        run: mvn -B checkstyle:check --no-transfer-progress || true

      - name: SpotBugs (Gradle)
        if: inputs.build-tool == 'gradle'
        run: ./gradlew spotbugsMain --no-daemon || true

  security-scan:
    name: Dependency Check
    if: inputs.enable-security-scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: ${{ inputs.build-tool }}

      - name: OWASP Dependency Check (Maven)
        if: inputs.build-tool == 'maven'
        run: mvn -B org.owasp:dependency-check-maven:check --no-transfer-progress || true

      - name: OWASP Dependency Check (Gradle)
        if: inputs.build-tool == 'gradle'
        run: |
          if grep -q "dependency-check" build.gradle 2>/dev/null; then
            ./gradlew dependencyCheckAnalyze --no-daemon || true
          else
            echo "OWASP plugin not configured in build.gradle — skipping"
          fi

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owasp-report
          path: |
            ${{ inputs.working-directory }}/target/dependency-check-report.html
            ${{ inputs.working-directory }}/build/reports/dependency-check-report.html

  platform-security-scan:
    name: Platform Security Scan
    if: inputs.enable-security-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trivy + gitleaks
        uses: terzo241-platform/platform-workflows/.github/actions/security-scan@main
        with:
          scan-type: "fs"
          severity: "HIGH,CRITICAL"
          enable-gitleaks: "true"
          fail-on-findings: "true"
